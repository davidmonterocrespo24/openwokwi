<?xml version="1.0" encoding="utf-8"?>
<svg width="37mm" height="38.5mm" version="1.1" viewBox="0 0 37 38.5" xmlns="http://www.w3.org/2000/svg">
  <title>CYD ESP32-2424S012</title>
  <desc>Cheap Yellow Display ESP32-2424S012 — ESP32-C3 with 1.28" GC9A01 round display (240x240)</desc>

  <!-- PCB board outline -->
  <rect x="0.2" y="0.2" width="36.6" height="38.1" rx="1.2" ry="1.2" fill="#1b4d3e" stroke="#0f3328" stroke-width="0.3"/>

  <!-- Display module PCB (square footprint) -->
  <rect x="1.5" y="0.8" width="34" height="33" rx="0.5" fill="#0e0e0e" stroke="#1a1a1a" stroke-width="0.2"/>

  <!-- GC9A01 display bezel ring -->
  <circle cx="18.5" cy="17.3" r="13.8" fill="#060606"/>

  <!-- GC9A01 display screen -->
  <circle cx="18.5" cy="17.3" r="12.2" fill="#080c18"/>

  <!-- Screen inner ring highlight -->
  <circle cx="18.5" cy="17.3" r="11.7" fill="none" stroke="#162850" stroke-width="0.9" opacity="0.7"/>

  <!-- Display label -->
  <text x="18.5" y="16.8" font-family="monospace" font-size="2" fill="#3a7ab8" text-anchor="middle" opacity="0.85">GC9A01</text>
  <text x="18.5" y="19.5" font-family="monospace" font-size="1.5" fill="#28578a" text-anchor="middle" opacity="0.75">240x240</text>

  <!-- ESP32-C3 chip label (bottom area) -->
  <text x="18.5" y="36.8" font-family="monospace" font-size="1.1" fill="#80cc80" text-anchor="middle" opacity="0.65">ESP32-C3</text>

  <!-- USB-C connector outline -->
  <rect x="15.8" y="36.8" width="5.4" height="1.5" rx="0.7" fill="#888" stroke="#666" stroke-width="0.15"/>

  <!-- Pin header pads (12 pins, 2.54mm pitch, centered on 37mm board) -->
  <!-- First center: x=4.53mm  pitch: 2.54mm  pad: 1.2mm wide x 2mm tall  y-center: 35.2mm -->
  <rect x="3.93" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="6.47" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="9.01" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="11.55" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="14.09" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="16.63" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="19.17" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="21.71" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="24.25" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="26.79" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="29.33" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>
  <rect x="31.87" y="34.2" width="1.2" height="2" rx="0.2" fill="#c8a000"/>

  <!-- Pin labels (above pads) -->
  <text x="4.53"  y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">3V3</text>
  <text x="7.07"  y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">GND</text>
  <text x="9.61"  y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">5V</text>
  <text x="12.15" y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">1</text>
  <text x="14.69" y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">2</text>
  <text x="17.23" y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">3</text>
  <text x="19.77" y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">16</text>
  <text x="22.31" y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">17</text>
  <text x="24.85" y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">18</text>
  <text x="27.39" y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">19</text>
  <text x="29.93" y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">TX</text>
  <text x="32.47" y="34.0" font-family="monospace" font-size="0.85" fill="#dddddd" text-anchor="middle">RX</text>
</svg>
